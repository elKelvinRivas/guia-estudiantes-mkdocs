site_name: Guía para Estudiantes Universitarios

theme:
  name: material
  language: es

  features:
    - navigation.top
    - search.highlight
    - content.code.copy
  
  palette:
    primary: blue grey
    accent: cyan


markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Inicio: index.md
  - Técnicas de Estudio: tecnicas-estudio.md
  - Gestión del Tiempo: gestion-tiempo.md
  - Recursos: recursos.md